<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREWLOG · FILM MAP — 台灣影視取景地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0a0a;
  --bg2:#111111;
  --bg3:#181818;
  --red:#C8422A;
  --white:#F0EBE3;
  --white2:rgba(240,235,227,0.7);
  --white3:rgba(240,235,227,0.35);
  --border:rgba(240,235,227,0.08);
  --border2:rgba(240,235,227,0.14);
  --nav-h:52px;
  --sidebar-w:40%;
}

html,body{
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--white);
  font-family:'Outfit','Noto Sans TC',sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ─── NAV ─── */
#nav{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--nav-h);
  background:rgba(10,10,10,0.96);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:1000;
  backdrop-filter:blur(12px);
}

#nav-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  letter-spacing:0.12em;
  color:var(--white);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
#nav-logo span.dot{color:var(--red)}
#nav-logo span.sub{
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--white3);
  letter-spacing:0.2em;
  padding-left:10px;
  border-left:1px solid var(--border2);
}

#nav-filters{
  display:flex;
  gap:2px;
}
.nf-btn{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.12em;
  padding:6px 14px;
  background:none;
  border:1px solid transparent;
  color:var(--white3);
  cursor:pointer;
  transition:all .2s;
}
.nf-btn:hover{color:var(--white);border-color:var(--border2)}
.nf-btn.active{
  color:var(--white);
  border-color:var(--border2);
  background:rgba(240,235,227,0.06);
}

#nav-back{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.1em;
  color:var(--white3);
  text-decoration:none;
  display:flex;
  align-items:center;
  gap:6px;
  transition:color .2s;
  flex-shrink:0;
}
#nav-back:hover{color:var(--white)}
#nav-back::before{content:'←';font-size:13px}

/* ─── LAYOUT ─── */
#layout{
  position:fixed;
  top:var(--nav-h);
  left:0;right:0;bottom:0;
  display:flex;
}

/* ─── MAP ─── */
#map-panel{
  flex:1;
  min-width:0;
  position:relative;
}
#map{
  width:100%;
  height:100%;
}

/* Leaflet popup override */
.leaflet-popup-content-wrapper{
  background:rgba(14,14,14,0.97)!important;
  border:1px solid var(--border2)!important;
  border-radius:0!important;
  box-shadow:0 8px 40px rgba(0,0,0,0.8)!important;
  padding:0!important;
}
.leaflet-popup-tip-container{display:none!important}
.leaflet-popup-content{margin:0!important;width:220px!important}
.leaflet-popup-close-button{
  color:var(--white3)!important;
  font-size:16px!important;
  top:8px!important;
  right:10px!important;
}
.leaflet-popup-close-button:hover{color:var(--white)!important}

.map-popup{padding:12px 14px}
.map-popup-drama{
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:0.15em;
  margin-bottom:5px;
}
.map-popup-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;
  letter-spacing:0.05em;
  color:var(--white);
  line-height:1.2;
  margin-bottom:4px;
}
.map-popup-scene{
  font-size:11px;
  color:var(--white3);
  line-height:1.5;
}

/* Map attribution */
.leaflet-control-attribution{
  background:rgba(10,10,10,0.8)!important;
  color:rgba(240,235,227,0.3)!important;
  font-size:9px!important;
}
.leaflet-control-attribution a{color:rgba(240,235,227,0.4)!important}

/* Zoom controls */
.leaflet-control-zoom{
  border:1px solid var(--border2)!important;
  border-radius:0!important;
}
.leaflet-control-zoom a{
  background:rgba(14,14,14,0.95)!important;
  color:var(--white)!important;
  border-bottom:1px solid var(--border)!important;
}
.leaflet-control-zoom a:hover{background:rgba(30,30,30,0.98)!important}

/* ─── SIDEBAR ─── */
#sidebar{
  width:var(--sidebar-w);
  min-width:340px;
  max-width:520px;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--border);
  background:var(--bg);
  overflow:hidden;
}

/* Poster strip */
#poster-strip{
  height:140px;
  min-height:140px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  overflow-y:hidden;
  display:flex;
  align-items:stretch;
  gap:0;
  scrollbar-width:none;
  -ms-overflow-style:none;
  background:var(--bg2);
}
#poster-strip::-webkit-scrollbar{display:none}

.poster-card{
  flex-shrink:0;
  width:88px;
  height:140px;
  position:relative;
  cursor:pointer;
  overflow:hidden;
  border-right:1px solid var(--border);
  transition:transform .2s;
}
.poster-card:hover .pc-bg{transform:scale(1.08)}
.poster-card.selected .pc-accent{opacity:1}
.poster-card.selected .pc-overlay{background:rgba(0,0,0,0.15)}

.pc-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:transform .4s ease;
}
.pc-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
  transition:background .2s;
}
.pc-accent{
  position:absolute;
  bottom:0;left:0;right:0;
  height:3px;
  opacity:0.35;
  transition:opacity .2s;
}
.pc-info{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:6px 6px 8px;
  background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,transparent 100%);
}
.pc-name{
  font-family:'Noto Sans TC',sans-serif;
  font-size:9px;
  font-weight:500;
  color:var(--white);
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.pc-year{
  font-family:'DM Mono',monospace;
  font-size:8px;
  color:var(--white3);
  margin-top:2px;
}
.pc-type-badge{
  position:absolute;
  top:6px;left:6px;
  font-family:'DM Mono',monospace;
  font-size:7px;
  letter-spacing:0.08em;
  padding:2px 4px;
  background:rgba(0,0,0,0.7);
  color:var(--white3);
}
.pc-count{
  position:absolute;
  top:6px;right:6px;
  font-family:'DM Mono',monospace;
  font-size:8px;
  font-weight:500;
  width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
}

/* Film detail */
#film-detail{
  height:200px;
  min-height:200px;
  border-bottom:1px solid var(--border);
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}
#fd-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center top;
  filter:blur(2px) brightness(0.3);
  transform:scale(1.05);
  transition:background-image .4s;
}
#fd-content{
  position:relative;
  z-index:1;
  padding:16px 18px;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}
#fd-meta-top{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
#fd-type{
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:0.18em;
  padding:3px 7px;
  border:1px solid rgba(240,235,227,0.3);
  color:var(--white2);
}
#fd-year{
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:0.12em;
  color:var(--white3);
}
#fd-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:0.06em;
  line-height:1.1;
  margin-bottom:8px;
  transition:color .3s;
}
#fd-director{
  font-size:11px;
  color:var(--white3);
  margin-bottom:3px;
  font-family:'DM Mono',monospace;
}
#fd-cast{
  font-size:11px;
  color:var(--white2);
  margin-bottom:8px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:1;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
#fd-synopsis{
  font-size:11.5px;
  color:var(--white2);
  line-height:1.65;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
#fd-loc-count{
  position:absolute;
  top:14px;right:16px;
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:var(--white3);
  letter-spacing:0.1em;
}
#fd-empty{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  gap:8px;
}
#fd-empty-label{
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:0.15em;
  color:var(--white3);
}

/* Location list */
#loc-list{
  flex:1;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:rgba(240,235,227,0.1) transparent;
}
#loc-list::-webkit-scrollbar{width:3px}
#loc-list::-webkit-scrollbar-thumb{background:rgba(240,235,227,0.1)}

#loc-list-header{
  padding:10px 18px 8px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:10;
}
#loc-list-title{
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:0.18em;
  color:var(--white3);
}
#loc-list-count{
  font-family:'DM Mono',monospace;
  font-size:10px;
  color:var(--white3);
}

.loc-item{
  display:flex;
  align-items:flex-start;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .15s;
  gap:12px;
}
.loc-item:hover{background:rgba(240,235,227,0.03)}
.loc-item.active{background:rgba(240,235,227,0.05)}

.loc-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;
  letter-spacing:0.05em;
  min-width:22px;
  line-height:1.2;
  flex-shrink:0;
  margin-top:1px;
}
.loc-body{flex:1;min-width:0}
.loc-name{
  font-size:12.5px;
  font-weight:500;
  color:var(--white);
  margin-bottom:3px;
  line-height:1.35;
}
.loc-scene{
  font-size:11px;
  color:var(--white3);
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.loc-drama-tag{
  font-family:'DM Mono',monospace;
  font-size:9px;
  letter-spacing:0.1em;
  padding:2px 6px;
  margin-bottom:4px;
  display:inline-block;
}

/* Group header for 全部 mode */
.loc-group-header{
  padding:10px 18px 8px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  font-family:'DM Mono',monospace;
  font-size:10px;
  letter-spacing:0.15em;
  color:var(--white3);
  display:flex;
  align-items:center;
  gap:8px;
}
.loc-group-dot{
  width:8px;height:8px;
  border-radius:50%;
  flex-shrink:0;
}

/* ─── MOBILE ─── */
@media(max-width:767px){
  :root{--nav-h:48px}

  #layout{flex-direction:column}
  #map-panel{
    height:55vh;
    flex:none;
  }
  #sidebar{
    width:100%;
    max-width:100%;
    min-width:0;
    height:45vh;
    border-left:none;
    border-top:1px solid var(--border);
    position:relative;
  }

  #poster-strip{height:100px;min-height:100px}
  .poster-card{width:72px;height:100px}
  #film-detail{display:none}

  #drag-handle{
    position:absolute;
    top:0;left:0;right:0;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:ns-resize;
    z-index:10;
  }
  #drag-handle::after{
    content:'';
    width:32px;height:3px;
    background:rgba(240,235,227,0.2);
    border-radius:2px;
  }

  #nav-logo span.sub{display:none}
  .nf-btn{padding:5px 10px;font-size:10px}
}

/* ─── ANIMATIONS ─── */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.loc-item{animation:fadeIn .2s ease both}

/* Marker pulse on select */
@keyframes markerPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.4)}
  100%{transform:scale(1)}
}
.marker-selected{animation:markerPulse .3s ease}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="/" id="nav-logo">
    CREWLOG<span class="dot">.</span>
    <span class="sub">FILM MAP</span>
  </a>
  <div id="nav-filters">
    <button class="nf-btn active" data-filter="all">全部</button>
    <button class="nf-btn" data-filter="電影">電影</button>
    <button class="nf-btn" data-filter="影集">影集</button>
  </div>
  <a href="/" id="nav-back">返回主頁</a>
</nav>

<!-- LAYOUT -->
<div id="layout">
  <!-- MAP -->
  <div id="map-panel">
    <div id="map"></div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="drag-handle"></div>

    <!-- Poster strip -->
    <div id="poster-strip"></div>

    <!-- Film detail -->
    <div id="film-detail">
      <div id="fd-bg"></div>
      <div id="fd-content">
        <div id="fd-loc-count"></div>
        <div id="fd-meta-top">
          <span id="fd-type"></span>
          <span id="fd-year"></span>
        </div>
        <div id="fd-title"></div>
        <div id="fd-director"></div>
        <div id="fd-cast"></div>
        <div id="fd-synopsis"></div>
      </div>
    </div>

    <!-- Location list -->
    <div id="loc-list">
      <div id="loc-list-header">
        <span id="loc-list-title">FILMING LOCATIONS</span>
        <span id="loc-list-count"></span>
      </div>
      <div id="loc-items"></div>
    </div>
  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────
const DRAMA_META = {
  sunshine: { name:'陽光女子合唱團', year:2025, color:'#C8422A', era:'近期', type:'電影', director:'林孝謙', cast:'陳意涵、翁倩玉、鍾欣凌、孫淑媚、苗可麗、安心亞、陳庭妮', synopsis:'一群中年女受刑人，在即將廢除的監獄裡組成合唱團，以歌聲找回自我尊嚴與人生的可能', behind:'林孝謙深入台灣矯正機構田調，與真實受刑人訪談，實地在宜蘭監獄取景', impact:'2025年台灣最受矚目的國片之一，引發社會對受刑人人權與獄政改革的廣泛討論', poster:'https://i.ytimg.com/vi/kGad1FVKnos/hqdefault.jpg' },
  zero: { name:'零日攻擊', year:2025, color:'#4a9de0', era:'近期', type:'影集', director:'羅景壬（聯合執導）', cast:'連俞涵、莊凱勛、高橋一生、杜汶澤、謝章穎', synopsis:'台灣遭受史無前例的混合戰攻擊，政府、軍方、駭客與媒體在極短時間內應對國家存亡的緊急時刻', behind:'史上第一部獲准在總統府、台北賓館正式取景的台灣電視劇', impact:'播出後引爆台灣社會對戰爭準備、混合戰威脅的自發討論', poster:'https://i.ytimg.com/vi/nGaXThXWTLc/hqdefault.jpg' },
  imperfect: { name:'不夠善良的我們', year:2024, color:'#c87ec8', era:'近期', type:'影集', director:'徐譽庭', cast:'林依晨、許瑋甯、賀軍翔、柯震東', synopsis:'兩個女人因同一個男人的出現，在中年時刻重新審視自己的選擇、委屈與遺憾', behind:'編劇徐譽庭親自執導，劇本靈感來自現實中對女性「委屈」的長期觀察', impact:'引發台灣女性觀眾極大共鳴，「你不夠善良嗎」成為流行詞', poster:'https://i.ytimg.com/vi/K9Mq9m_Qq2A/hqdefault.jpg' },

  someday: { name:'想見你', year:2019, color:'#7ec87e', era:'近期', type:'影集', director:'黃天仁', cast:'柯佳嬿、許光漢、施柏宇、林哲熹', synopsis:'一個現代女生因一首歌和隨身聽穿越至1998年，靈魂互換謎題交織著時空戀愛與謀殺懸案', behind:'製作公司原本預算極小，播出後口碑爆炸追加宣傳費用', impact:'在台灣掀起「時空穿越」熱潮；許光漢因此暴紅', poster:'https://i.ytimg.com/vi/0o3E0IZTqgs/hqdefault.jpg' },

// ─── STATE ───────────────────────────────────────────────
let selectedDrama = 'sunshine';
let typeFilter = 'all'; // 'all', '電影', '影集'
let map, markersLayer = {};
let allMarkersGroup;

// ─── MAP INIT ───────────────────────────────────────────
function initMap() {
  map = L.map('map', {
    center: [23.5, 120.97],
    zoom: 7,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // Build all markers
  buildMarkers();
  // Initial render
  selectDrama('sunshine', false);
}

// ─── BUILD MARKERS ──────────────────────────────────────
function buildMarkers() {
  // Remove all existing markers
  Object.values(markersLayer).forEach(m => map.removeLayer(m));
  markersLayer = {};

  const visibleDramas = getVisibleDramas();

  dramaLocations.forEach(loc => {
    if (!visibleDramas.includes(loc.drama)) return;
    const meta = DRAMA_META[loc.drama];
    if (!meta) return;

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:12px;height:12px;
        background:${meta.color};
        border-radius:50%;
        border:2px solid rgba(255,255,255,0.3);
        box-shadow:0 0 8px ${meta.color}88;
        cursor:pointer;
        transition:transform .15s;
      "></div>`,
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });

    const marker = L.marker([loc.lat, loc.lng], { icon })
      .addTo(map)
      .on('click', () => {
        selectDrama(loc.drama, true);
        highlightLocItem(loc.id);
        showMarkerPopup(marker, loc, meta);
      });

    marker._locId = loc.id;
    marker._dramaKey = loc.drama;
    markersLayer[loc.id] = marker;
  });
}

function showMarkerPopup(marker, loc, meta) {
  const popup = L.popup({ closeButton: true, offset: [0, -6], maxWidth: 240 })
    .setLatLng([loc.lat, loc.lng])
    .setContent(`
      <div class="map-popup">
        <div class="map-popup-drama" style="color:${meta.color}">${meta.name} · ${meta.year}</div>
        <div class="map-popup-name">${loc.name}</div>
        <div class="map-popup-scene">${loc.scene}</div>
      </div>
    `)
    .openOn(map);
}

// ─── FILTER ─────────────────────────────────────────────
function getVisibleDramas() {
  if (typeFilter === 'all') return Object.keys(DRAMA_META);
  return Object.keys(DRAMA_META).filter(k => DRAMA_META[k].type === typeFilter);
}

function applyTypeFilter(newFilter) {
  typeFilter = newFilter;

  // Update nav filter buttons
  document.querySelectorAll('.nf-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === typeFilter);
  });

  // Rebuild markers
  buildMarkers();

  // Update poster strip
  renderPosterStrip();

  // Re-select or reset
  const visible = getVisibleDramas();
  if (visible.includes(selectedDrama)) {
    selectDrama(selectedDrama, false);
  } else if (visible.length > 0) {
    selectDrama(visible[0], false);
  }
}

// ─── SELECT DRAMA ────────────────────────────────────────
function selectDrama(key, flyToFirst) {
  selectedDrama = key;

  // Update poster strip selection
  document.querySelectorAll('.poster-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.key === key);
    if (el.dataset.key === key) {
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }
  });

  // Update film detail panel
  renderFilmDetail(key);

  // Update location list
  renderLocList(key);

  // Fly map to first location
  if (flyToFirst) {
    const locs = dramaLocations.filter(l => l.drama === key);
    if (locs.length > 0) {
      map.flyTo([locs[0].lat, locs[0].lng], 12, { duration: 1.2 });
    }
  }

  // Highlight markers
  Object.values(markersLayer).forEach(m => {
    const el = m.getElement();
    if (!el) return;
    const dot = el.querySelector('div');
    if (!dot) return;
    if (m._dramaKey === key) {
      dot.style.width = '14px';
      dot.style.height = '14px';
      dot.style.border = '2px solid rgba(255,255,255,0.7)';
      dot.style.zIndex = '1000';
    } else {
      dot.style.width = '10px';
      dot.style.height = '10px';
      dot.style.border = '2px solid rgba(255,255,255,0.15)';
      dot.style.opacity = '0.5';
    }
  });
}

// ─── RENDER POSTER STRIP ────────────────────────────────
function renderPosterStrip() {
  const strip = document.getElementById('poster-strip');
  strip.innerHTML = '';

  const visible = getVisibleDramas();

  visible.forEach(key => {
    const meta = DRAMA_META[key];
    if (!meta) return;
    const locCount = dramaLocations.filter(l => l.drama === key).length;

    const card = document.createElement('div');
    card.className = 'poster-card' + (key === selectedDrama ? ' selected' : '');
    card.dataset.key = key;

    const bgStyle = meta.poster
      ? `background-image:url('${meta.poster}');background-color:${meta.color}33`
      : `background:linear-gradient(135deg,${meta.color}66,${meta.color}22)`;

    card.innerHTML = `
      <div class="pc-bg" style="${bgStyle}"></div>
      <div class="pc-overlay"></div>
      <div class="pc-type-badge">${meta.type}</div>
      <div class="pc-count" style="color:${meta.color}">${locCount}</div>
      <div class="pc-info">
        <div class="pc-name">${meta.name}</div>
        <div class="pc-year">${meta.year}</div>
      </div>
      <div class="pc-accent" style="background:${meta.color}"></div>
    `;

    card.addEventListener('click', () => selectDrama(key, true));
    strip.appendChild(card);
  });
}

// ─── RENDER FILM DETAIL ──────────────────────────────────
function renderFilmDetail(key) {
  const meta = DRAMA_META[key];
  if (!meta) return;

  const locs = dramaLocations.filter(l => l.drama === key);

  const fdBg = document.getElementById('fd-bg');
  if (meta.poster) {
    fdBg.style.backgroundImage = `url('${meta.poster}')`;
  } else {
    fdBg.style.backgroundImage = `linear-gradient(135deg, ${meta.color}55, transparent)`;
  }

  document.getElementById('fd-title').textContent = meta.name;
  document.getElementById('fd-title').style.color = meta.color;
  document.getElementById('fd-type').textContent = meta.type;
  document.getElementById('fd-year').textContent = meta.year;
  document.getElementById('fd-director').textContent = '導演：' + meta.director;
  document.getElementById('fd-cast').textContent = meta.cast;
  document.getElementById('fd-synopsis').textContent = meta.synopsis;
  document.getElementById('fd-loc-count').textContent = locs.length + ' 個取景地';
}

// ─── RENDER LOCATION LIST ────────────────────────────────
function renderLocList(key) {
  const container = document.getElementById('loc-items');
  const header = document.getElementById('loc-list-title');
  const countEl = document.getElementById('loc-list-count');
  container.innerHTML = '';

  const locs = dramaLocations.filter(l => l.drama === key);
  const meta = DRAMA_META[key];

  header.textContent = 'FILMING LOCATIONS';
  countEl.textContent = locs.length + ' 筆';

  locs.forEach((loc, i) => {
    const item = document.createElement('div');
    item.className = 'loc-item';
    item.id = 'loc-' + loc.id;
    item.style.animationDelay = (i * 0.04) + 's';

    item.innerHTML = `
      <div class="loc-num" style="color:${meta.color}">${String(i + 1).padStart(2, '0')}</div>
      <div class="loc-body">
        <div class="loc-name">${loc.name}</div>
        <div class="loc-scene">${loc.scene}</div>
      </div>
    `;

    item.addEventListener('click', () => {
      map.flyTo([loc.lat, loc.lng], 14, { duration: 1.0 });
      highlightLocItem(loc.id);
      const marker = markersLayer[loc.id];
      if (marker) showMarkerPopup(marker, loc, meta);
    });

    container.appendChild(item);
  });
}

function highlightLocItem(locId) {
  document.querySelectorAll('.loc-item').forEach(el => {
    el.classList.toggle('active', el.id === 'loc-' + locId);
  });
  const el = document.getElementById('loc-' + locId);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ─── NAV FILTER BUTTONS ──────────────────────────────────
document.querySelectorAll('.nf-btn').forEach(btn => {
  btn.addEventListener('click', () => applyTypeFilter(btn.dataset.filter));
});

// ─── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderPosterStrip();
  initMap();
});
</script>
</body>
</html>
